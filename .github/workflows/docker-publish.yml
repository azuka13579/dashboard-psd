name: Build & Publish Docker Images

# Hasil:
#   ghcr.io/<owner>/dashboard-web:main-YYYYMMDD   (frontend)
#   ghcr.io/<owner>/dashboard-api:main-YYYYMMDD   (backend)
# Tanggal memakai zona waktu WIB (Asia/Jakarta).

on:
  push:
    branches: [master]
  workflow_dispatch:

permissions:
  contents: read
  packages: write

concurrency:
  group: docker-publish-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    name: ${{ matrix.package }}
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        include:
          - package: dashboard-web
            context: ./frontend
            title: Dashboard Zonasi Iklim (Frontend)
          - package: dashboard-api
            context: ./backend
            title: Dashboard Zonasi Iklim (API)

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Siapkan nama image dan tag
        id: vars
        run: |
          OWNER=$(echo "${{ github.repository_owner }}" | tr '[:upper:]' '[:lower:]')
          DATE=$(TZ=Asia/Jakarta date +%Y%m%d)
          echo "image=ghcr.io/${OWNER}/${{ matrix.package }}" >> "$GITHUB_OUTPUT"
          echo "tag=main-${DATE}" >> "$GITHUB_OUTPUT"

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Login ke GitHub Container Registry
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Metadata image
        id: meta
        uses: docker/metadata-action@v5
        with:
          images: ${{ steps.vars.outputs.image }}
          tags: |
            type=raw,value=${{ steps.vars.outputs.tag }}
          labels: |
            org.opencontainers.image.title=${{ matrix.title }}

      - name: Build & push ${{ matrix.package }}
        uses: docker/build-push-action@v6
        with:
          context: ${{ matrix.context }}
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          cache-from: type=gha,scope=${{ matrix.package }}
          cache-to: type=gha,mode=max,scope=${{ matrix.package }}

      - name: Ringkasan
        run: |
          echo "### ${{ matrix.package }}" >> "$GITHUB_STEP_SUMMARY"
          echo '```' >> "$GITHUB_STEP_SUMMARY"
          echo "docker pull ${{ steps.vars.outputs.image }}:${{ steps.vars.outputs.tag }}" >> "$GITHUB_STEP_SUMMARY"
          echo '```' >> "$GITHUB_STEP_SUMMARY"
